name: NovelLens self-tests

on:
  push:
    branches:
      - main
      - feat/readawrite-story-library
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run analyzer and import tests
        run: node test.js
